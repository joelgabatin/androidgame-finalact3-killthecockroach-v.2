<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container text-center mt-5">
  <h1>Register</h1>

  <div class="form-group">
    <input type="text" id="regUsername" class="form-control" placeholder="Username">
  </div>
  <div class="form-group">
    <input type="password" id="regPassword" class="form-control" placeholder="Password">
  </div>
  <button id="registerBtn" class="btn btn-success">Register</button>
  <p class="mt-3">Already have an account? <a href="login.html">Login</a></p>

  <script>
    $('#registerBtn').on('click', function() {
      const username = $('#regUsername').val();
      const password = $('#regPassword').val();

      if (!username || !password) {
        alert('Please enter username and password');
        return;
      }

      let users = JSON.parse(localStorage.getItem('users')) || [];
      const userExists = users.find(u => u.username === username);

      if (userExists) {
        alert('Username already exists!');
        return;
      }

      users.push({ username, password });
      localStorage.setItem('users', JSON.stringify(users));
      alert('Registration successful!');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
