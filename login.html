<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container text-center mt-5">
  <h1>Login</h1>

  <div class="form-group">
    <input type="text" id="loginUsername" class="form-control" placeholder="Username">
  </div>
  <div class="form-group">
    <input type="password" id="loginPassword" class="form-control" placeholder="Password">
  </div>
  <button id="loginBtn" class="btn btn-primary">Login</button>
  <p class="mt-3">No account? <a href="register.html">Register</a></p>

  <script>
    // Check if users exist, else create default admin
    if (!localStorage.getItem('users')) {
      const defaultUsers = [{ username: 'admin', password: '1234' }];
      localStorage.setItem('users', JSON.stringify(defaultUsers));
    }

    $('#loginBtn').on('click', function() {
      const username = $('#loginUsername').val();
      const password = $('#loginPassword').val();

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        localStorage.setItem('loggedInUser', username);
        alert('Login successful!');
        window.location.href = 'index.html';
      } else {
        alert('Invalid username or password!');
      }
    });
  </script>
</body>
</html>
